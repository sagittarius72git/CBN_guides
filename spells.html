<style>

:root {

  --ai: #4B3A86;        /* 菫 violet accent */

  --gold: #8E651C;      /* 金茶 for mod badges */
  --gold-soft: #F4ECDD;
  --good: #2F6B4F; --good-soft: #E2EFE8;
  --bad: #9A3B2E; --bad-soft: #F6E4E0;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141B; --surface: #1F1C26; --ink: #E9E6EE; --muted: #A7A0B3; --line: #37323F;
    --ai: #B3A3EC; --ai-soft: #2D2643; --gold: #D9AE62; --gold-soft: #3A3021;
    --good: #7FC7A1; --good-soft: #1F3329; --bad: #E79A8C; --bad-soft: #3B2421; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141B; --surface: #1F1C26; --ink: #E9E6EE; --muted: #A7A0B3; --line: #37323F;
  --ai: #B3A3EC; --ai-soft: #2D2643; --gold: #D9AE62; --gold-soft: #3A3021;
  --good: #7FC7A1; --good-soft: #1F3329; --bad: #E79A8C; --bad-soft: #3B2421; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px; margin: 0;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 28px; }
header { padding-block: 32px 0; display: grid; gap: 10px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.warn { display: inline-block; background: var(--gold-soft); color: var(--gold); font-weight: 700; padding: 2px 10px; border-radius: 4px; font-size: 13px; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 24px; margin: 0; text-wrap: balance; }
h3 { margin: 0; }
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
.rules summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.rules ul { margin: 12px 0 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 76ch; }
.filters { display: grid; gap: 10px; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); }
@media (min-width: 760px) and (min-height: 700px) { .filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.frow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.flabel { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; min-width: 4.5em; }
input[type="search"] { flex: 1 1 260px; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.chip { font: inherit; font-size: 13px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ai); color: var(--surface); border-color: var(--ai); }
.chip:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
select { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
details.index { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.index > summary { cursor: pointer; padding: 12px 16px; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.tablebox { overflow-x: auto; border-top: 1px solid var(--line); max-height: 60vh; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
td a { color: var(--ai); text-decoration: none; font-weight: 700; }
td a:hover { text-decoration: underline; }
tr:last-child td { border-bottom: 0; }
.sec-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-top: 8px; border-top: 2px solid var(--ink); }
.intro { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; color: var(--muted); font-size: 14px; max-width: 76ch; }
.cards { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: grid; gap: 10px; min-width: 0; scroll-margin-top: 16px; }
@media (min-width: 760px) and (min-height: 700px) { .card { scroll-margin-top: 270px; } }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.card-head h3 { font-family: var(--f-display); font-weight: 800; font-size: 21px; }
.en { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--gold-soft); color: var(--gold); font-weight: 700; }
.badge.sec { background: var(--ai-soft); color: var(--ai); }
.oneline { font-weight: 700; margin: 0; }
.summary { margin: 0; max-width: 72ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; }
.flags { font-size: 12px; color: var(--muted); margin: 0; }
.gb { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.block h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.1em; }
.block ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.block li { font-size: 14px; }
.block.good h4 { color: var(--good); }
.block.bad h4 { color: var(--bad); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.back { margin-left: auto; font-size: 13px; color: var(--ai); text-decoration: none; white-space: nowrap; }
.back:hover { text-decoration: underline; }
.fab { position: fixed; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 6;
  background: var(--ai); color: var(--surface); text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
footer { color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
@media (max-width: 560px) { .card { padding: 16px; } .hide-sm { display: none; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<script id="data" type="application/json">{"common": ["数値の「A〜B」は呪文レベル0のときと最大レベルのときの値。レベルLの値は「最小値＋L×増分」を四捨五入し、最大値で頭打ちにしたもの。", "時間は1ターン＝1秒。詠唱時間・効果時間は秒・分・時間に直して書いている。", "「知性で強化」などと書いた呪文は、その能力値が8より1高いごとにダメージ+10%、消費と詠唱時間-10%（下限は10%）。8より低いと逆になる。割合はオプション MAGIC_STAT_SCALING_PERCENT（既定10）。", "失敗率：実効値＝2×(呪文レベル−習得難度)＋強化に使う能力値＋呪文のスキル。失敗率は((実効値−30)÷30)²で、実効値30を超えると0%、0未満なら100%。「必ず成功」と書いた呪文は常に0%。", "失敗率が上がる条件：手を使う詠唱は両腕の動作制限の合計が20を超えた分×0.5%、口で唱える詠唱は口の動作制限が5を超えた分×1%。集中が必要な呪文は集中力が低いほど失敗しやすい。", "消費が増える条件：「手を使わない」でない呪文は、両手の動作制限の合計が10を超えた分1点ごとに消費+10（HPの呪文は+1、スタミナの呪文は+100）。", "詠唱が遅くなる条件：「脚を使わない」でない呪文は両脚の動作制限の合計が20を超えた分×3、手を使う詠唱は両腕の合計が20を超えた分×2の行動ポイントが増える。手を使う呪文（肉体技を除く）は、魔法の焦点でない武器を持っていると詠唱時間が1.5倍。", "詠唱に失敗すると消費は0で、時間だけ使い、経験は成功時の5分の1。レベル0の呪文は初めて成功した時点でレベル1になる。", "呪文書・巻物を読んで覚えるには明かりが要り、時間は30分×(1＋習得難度÷(1＋(知性−8)÷8)＋スキル÷10)。", "マナの上限は(1000＋知性×100−800)×変異の倍率＋変異の加算で、8時間で満タンまで回復する。スタミナの上限は10000。", "HPを使う呪文は、唱えるときに部位を選び、その部位のHPが減り、消費÷3（最低1）の痛みも受ける。", "「狙った地点に直接効く」と書いた呪文は弾を飛ばさず、狙った地点で効果が起きる。弾の呪文は狙った地点まで飛び、途中で通れない地形（壁など）に当たるとその手前で効果が起きる（途中の生き物では止まらない）。範囲は「壁越し」と書いたもの以外、壁の向こうには広がらない。ダメージは命中判定なしで当たり、防御無視以外は装甲で減る。「対象の数で等分」は範囲内の数でダメージを割る。", "特性「乱闘者」を持つと、「乱闘者でも使える」か「肉体技」の呪文しか唱えられない。", "呪文データにある装甲貫通（pierce）と継続ダメージ（dot）の値は、本体では読み込むだけで使われていないので書いていない。", "状態の効果時間が0の呪文は、状態が付いても次のターン処理で外れる（本体の処理より）。"], "sections": [{"key": "ARCANA_SPELL_CLASS_MAGIC_SIGN", "mod": "アルカナ", "title": "魔法印", "intro": ["クラスの説明：彼方の神秘を探求する中で、肉体と精神から力を引き出す呪文を一つ以上習得した。", "スタミナを使い、必ず成功し、口で唱えるだけで手足は使わない（口の動作制限で失敗はしないが、詠唱音は出る）。能力値による強化はない。", "使うたびに「魔法印の疲弊」が延びる（最大200分）。疲弊の間は25秒ごとに眠気+1。疲弊の秒数はレベルが上がると短くなる。", "覚え方：一部は紋様巻物（アルカナのレシピで作れる）を読んで覚える。キャラ作成時にアルカナの職業・シナリオで選べるものも多い（1つ目に2〜3点、レベル+1ごとに1点、最大Lv10）。", "多くは特性「乱闘者」でも使える。"], "count": 36}, {"key": "ARCANA_SPELL_CLASS_ARCANE_BLESSING", "mod": "アルカナ", "title": "秘術の祝福", "intro": ["クラスの説明：異界の神性との契約を通じて、内なる精神から力を引き出す呪文を一つ以上習得した。", "マナを使い、必ず成功し、集中が必要。手足は使わない。能力値による強化はない。", "覚え方：変異系統「帳の探索者」の印（変化・増強・破壊・守護・召喚の5系統、各I〜VI）を得ると、段階ごとに祝福を1つずつ覚える。印III以降は境界変異「帳の体現者」が必要。呪文書やキャラ作成では覚えられない。"], "count": 30}, {"key": " <script>
// データ / data
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const anchor = (id) => 'sp-' + id.replace(/_/g, '-');
const SEC = Object.fromEntries(D.sections.map((s) => [s.key, s]));
document.querySelector('.wrap').id = 'top';

// 共通ルール / common rules
$('#rules').innerHTML = D.common.map((r) => `<li>${esc(r)}</li>`).join('');
$('#foot').innerHTML = (D.unobtainable.length ? `<p style="margin:0">入手手段が見つからないクラス呪文（定義はあるが、呪文書・変異・職業などの入手元がデータに無い）：${esc(D.unobtainable.join('、'))}</p>` : '')
  + '<p style="margin:0">数値は各MODのJSONと本体の計算式から出したもの。ゲーム内での確認はしていない。</p>';

// 絞り込みの状態 / filter state
const MODS = [...new Set(D.spells.map((s) => s.mod))];
const ENERGIES = [...new Set(D.spells.map((s) => s.energy))];
const KINDS = [['all', 'すべて'], ['learn', '覚える呪文'], ['item', 'アイテムで発動']];
const state = { q: '', mods: new Set(MODS), sec: 'all', en: 'all', kind: 'all' };
try { const k = localStorage.getItem('sp-kind'); if (k) state.kind = k; } catch (e) {}

function chip(label, pressed, onclick) {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = label;
  b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
  b.addEventListener('click', onclick);
  return b;
}
function radio(container, items, key, store) {
  items.forEach(([k, label]) => {
    const b = chip(label, state[key] === k, () => {
      state[key] = k;
      container.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      if (store) { try { localStorage.setItem(store, k); } catch (e) {} }
      render();
    });
    container.appendChild(b);
  });
}
function buildFilters() {
  const mc = $('#modchips');
  MODS.forEach((m) => {
    const b = chip(m, true, () => {
      if (state.mods.has(m)) state.mods.delete(m); else state.mods.add(m);
      b.setAttribute('aria-pressed', state.mods.has(m) ? 'true' : 'false');
      fillSections();
      render();
    });
    mc.appendChild(b);
  });
  radio($('#enchips'), [['all', 'すべて'], ...ENERGIES.map((e) => [e, e])], 'en');
  radio($('#kindchips'), KINDS, 'kind', 'sp-kind');
  $('#sec').addEventListener('change', (e) => { state.sec = e.target.value; render(); });
  fillSections();
}
function fillSections() {
  const sel = $('#sec');
  const opts = D.sections.filter((s) => s.count && state.mods.has(s.mod));
  if (state.sec !== 'all' && !opts.some((s) => s.key === state.sec)) state.sec = 'all';
  sel.innerHTML = `<option value="all">すべての系統</option>` + opts.map((s) =>
    `<option value="${s.key}" ${s.key === state.sec ? 'selected' : ''}>${esc(s.title)}（${s.count}）</option>`).join('');
}

// 検索用テキスト / searchable text per spell
D.spells.forEach((s) => {
  s._text = [s.name, s.name_en, s.oneline, s.summary, SEC[s.section].title, ...s.good, ...s.bad, ...s.meta,
    ...s.learn, ...(s.items || []), ...s.flags, ...s.exertion, ...s.components].join(' ').toLowerCase();
});

function visible(s) {
  if (!state.mods.has(s.mod)) return false;
  if (state.sec !== 'all' && s.section !== state.sec) return false;
  if (state.en !== 'all' && s.energy !== state.en) return false;
  if (state.kind !== 'all' && s.kind !== state.kind) return false;
  if (state.q && !s._text.includes(state.q)) return false;
  return true;
}

const list = (cls, title, arr) => arr.length ? `<div class="block ${cls}"><h4>${title}</h4><ul>${arr.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';

function card(s) {
  const sec = SEC[s.section];
  const extra = [...s.exertion, ...(s.components.length ? ['材料（唱えるたびに使う）：' + s.components.join('、')] : [])];
  return `<article class="card" id="${anchor(s.id)}">
    <div class="card-head"><h3>${esc(s.name)}</h3>${s.name !== s.name_en ? `<span class="en">${esc(s.name_en)}</span>` : ''}
      <span class="badge">${esc(s.mod)}</span><span class="badge sec">${esc(sec.title)}</span><a class="back" href="#top">↑ 上へ</a></div>
    <p class="oneline">${esc(s.oneline)}</p>
    <p class="summary">${esc(s.summary)}</p>
    ${s.meta.length ? `<div class="meta">${s.meta.map((m) => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
    ${s.flags.length ? `<p class="flags">特徴：${esc(s.flags.join('／'))}</p>` : ''}
    ${extra.length ? list('', '代償', extra) : ''}
    ${(s.good.length || s.bad.length) ? `<div class="gb">${list('good', '強み', s.good)}${list('bad', '弱み', s.bad)}</div>` : ''}
    ${list('', '覚え方', s.learn)}
    ${list('', '発動するアイテム', s.items || [])}
  </article>`;
}

function render() {
  const vis = D.spells.filter(visible);
  $('#count').textContent = `${vis.length} / ${D.spells.length} 件`;
  $('#index').innerHTML = vis.map((s) => `<tr><td><a href="#${anchor(s.id)}">${esc(s.name)}</a></td><td>${esc(SEC[s.section].title)}</td><td class="hide-sm">${esc(s.cost_short)}</td><td class="hide-sm">${esc(s.oneline)}</td></tr>`).join('')
    || '<tr><td colspan="4">条件に合う呪文はありません。絞り込みを外してください。</td></tr>';
  const out = [];
  D.sections.forEach((g) => {
    const items = vis.filter((s) => s.section === g.key);
    if (!items.length) return;
    out.push(`<section style="display:grid;gap:14px"><div class="sec-title"><h2>${esc(g.title)}</h2><span class="badge">${esc(g.mod)}</span><span class="count">${items.length} 件</span></div>
      <ul class="intro">${g.intro.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <div class="cards">${items.map(card).join('')}</div></section>`);
  });
  $('#sections').innerHTML = out.join('');
}

$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
buildFilters();
render();
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
